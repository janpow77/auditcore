<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlowAudit – Web Components ohne Bundler</title>
    <link rel="stylesheet" href="./node_modules/@auditcore/ui/dist/ui.css" />
    <style>
      html { background: var(--fa-color-bg); color: var(--fa-color-text); font-family: var(--fa-font-sans); }
    </style>
    <!-- Bare Imports der Pakete auf Dateien abbilden (Pfade relativ zu dieser Seite). -->
    <script type="importmap">
      {
        "imports": {
          "@auditcore/ui/elements": "./node_modules/@auditcore/ui/dist/elements.js",
          "@auditcore/ui-core": "./node_modules/@auditcore/ui-core/dist/index.js",
          "@auditcore/common": "./node_modules/@auditcore/common/dist/index.js",
          "@auditcore/common/browser": "./node_modules/@auditcore/common/dist/browser.js",
          "@auditcore/kanban-core": "./node_modules/@auditcore/kanban-core/dist/index.js",
          "vue": "./node_modules/vue/dist/vue.esm-browser.prod.js",
          "leaflet": "./node_modules/leaflet/dist/leaflet-src.esm.js"
        }
      }
    </script>
  </head>
  <body>
    <main style="max-width: 48rem; margin: 2rem auto; padding: 0 1rem">
      <h1>Belege</h1>
      <flowaudit-table id="belege"></flowaudit-table>
      <p id="auswahl" role="status"></p>
    </main>
    <script type="module">
      import { defineFlowauditElements } from '@auditcore/ui/elements'

      defineFlowauditElements({ locale: 'de' })
      const table = document.getElementById('belege')
      // Objekte und Listen als JS-Eigenschaften setzen, nicht als Attribute.
      table.caption = 'Belege'
      table.clickable = true
      table.columns = [
        { key: 'beleg', label: 'Beleg', sortable: true },
        { key: 'betrag', label: 'Betrag (EUR)', align: 'end' },
      ]
      table.rows = [
        { id: 'r1', beleg: 'R-2026-001', betrag: '1.250,50' },
        { id: 'r2', beleg: 'R-2026-002', betrag: '980,00' },
      ]
      // Ereignisse: CustomEvent in kebab-case, Nutzdaten in detail[0].
      table.addEventListener('row-click', (event) => {
        document.getElementById('auswahl').textContent = `Ausgewählt: ${event.detail[0].beleg}`
      })
    </script>
  </body>
</html>
