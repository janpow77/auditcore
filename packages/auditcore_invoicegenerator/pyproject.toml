[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditcore_invoicegenerator"
version = "0.2.3"
description = "Characterized synthetic invoice profiles and explicit test scenarios"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["auditcore_dummygenerator==0.1.3"]

[project.optional-dependencies]
pdf = ["reportlab>=4.5.1,<6"]
dev = ["pytest>=8", "pytest-xdist>=3.6", "pytest-timeout>=2.3", "ruff>=0.11", "mypy>=1.15", "reportlab>=4.5.1,<6", "pypdf>=6.19,<7", "hypothesis>=6.100"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditcore_invoicegenerator = ["py.typed", "provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --durations=25"
timeout = 120
markers = [
    "slow: läuft länger als etwa 5 s; mit -m 'not slow' abwählbar",
    "gpu: braucht torch/transformers (Donut); gezielt mit -m gpu",
    "network: braucht Netzzugang; in CI ohne Netz abwählbar",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true

[tool.auditcore-bibquality]
strict = true
regression-command = ["python", "-I", "-m", "pytest", "tests", "-q"]
