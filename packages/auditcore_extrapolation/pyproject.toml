[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditcore_extrapolation"
version = "0.1.0"
description = "Projected errors, precision, TER and RER for audit authorities along the Commission sampling guidance"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["auditcore_common==0.2.0"]

[project.optional-dependencies]
web = ["starlette>=0.26"]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.11",
    "mypy>=1.15",
    "build>=1.2",
    "bandit>=1.7",
    "starlette>=0.26",
    "fastapi>=0.100",
    "httpx>=0.24",
    "auditcore_sampling==0.2.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditcore_extrapolation = ["py.typed", "provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# Keine feste python_version: jeder CI-Job prüft gegen seine eigene Laufzeit.
strict = true

[tool.auditcore-bibquality]
strict = true
regression-command = ["python", "-m", "pytest", "tests", "-q"]
