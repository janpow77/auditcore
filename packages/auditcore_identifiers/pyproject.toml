[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditcore_identifiers"
version = "0.2.0"
description = "Check and normalise IBAN, BIC, EU VAT IDs, German tax identifiers and LEI with strict and legacy profiles"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["auditcore_common==0.2.0"]

[project.optional-dependencies]
web = ["starlette>=0.26.1,<2"]
fastapi = ["fastapi>=0.92", "starlette>=0.26.1,<2"]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "mypy>=1.15",
    "build>=1.2",
    "bandit>=1.7",
    "starlette>=0.26.1,<2",
    "fastapi>=0.92",
    "httpx>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditcore_identifiers = ["py.typed", "provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true

[tool.auditcore-bibquality]
strict = true
regression-command = ["python", "-m", "pytest", "tests", "-q"]
