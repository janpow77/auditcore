[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditcore_compute"
version = "0.1.0"
description = "Deterministic numeric kernels for audit data: optional Numba JIT with Python fallback, cent-exact quotas and interest, plausibility checks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
jit = ["numba>=0.59"]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.11",
    "mypy>=1.15",
    "build>=1.2",
    "bandit>=1.7",
    "numba>=0.59",
    "pandas>=2",
    "polars>=1.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditcore_compute = ["py.typed", "provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --durations=25"
timeout = 120
markers = [
    "slow: läuft länger als etwa 5 s; mit -m 'not slow' abwählbar",
    "gpu: braucht torch/transformers (Donut); gezielt mit -m gpu",
    "network: braucht Netzzugang; in CI ohne Netz abwählbar",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# Keine feste python_version: jeder CI-Job prüft gegen seine eigene Laufzeit.
strict = true

[[tool.mypy.overrides]]
module = ["numba", "numba.*"]
ignore_missing_imports = true

[tool.auditcore-bibquality]
strict = true
regression-command = ["python", "-m", "pytest", "tests", "-q"]
