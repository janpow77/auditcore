[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditcore_geo"
version = "0.3.0"
description = "Characterized geo core: great-circle distances with explicit earth profiles, radius search, point in polygon with boundary, UTM, GeoPackage polygons, Douglas-Peucker, a Nominatim harvest adapter and a REST contract for map user interfaces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.optional-dependencies]
geocoder = ["auditcore_harvest==0.1.1"]
web = ["starlette>=0.26.1"]
fastapi = ["fastapi>=0.92"]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "mypy>=1.15",
    "build>=1.2",
    "auditcore_harvest==0.1.1",
    "starlette>=0.26.1",
    "fastapi>=0.92",
    "httpx>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditcore_geo = ["py.typed", "provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.auditcore-bibquality]
strict = true
regression-command = ["python", "-m", "pytest", "tests", "-q"]
