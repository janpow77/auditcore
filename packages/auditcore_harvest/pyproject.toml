[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditcore_harvest"
version = "0.1.3"
description = "Shared harvest core: source contracts, paging/retry engine, checkpoints and adapter contract tests"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["auditcore_common==0.2.0"]

[project.optional-dependencies]
xml = ["defusedxml>=0.7.1"]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "build>=1.2", "defusedxml>=0.7.1"]

[project.scripts]
auditcore-harvest = "auditcore_harvest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditcore_harvest = ["py.typed", "provenance.json", "catalogs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.auditcore-bibquality]
strict = true
regression-command = ["python", "-m", "pytest", "tests", "-q"]
