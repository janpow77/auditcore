[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditcore_invoicesynth"
version = "0.1.2"
description = "Synthetic German/Austrian invoice images with Donut ground truth, manifests and evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["auditcore_invoicegenerator==0.2.2"]

[project.optional-dependencies]
render = ["pillow>=9.4"]
# Nachtraining (E3): CPU- oder CUDA-Build (cu128 für Blackwell) über den Paketindex wählen.
train = [
    "torch>=2.7",
    "transformers>=4.46,<6",
    "tokenizers>=0.20",
    "sentencepiece>=0.2",
    "safetensors>=0.4",
    "pillow>=9.4",
]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "build>=1.2", "bandit>=1.7", "pillow>=9.4"]

[project.scripts]
auditcore-invoicesynth = "auditcore_invoicesynth.cli:main"
auditcore-invoicesynth-train = "auditcore_invoicesynth.train.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditcore_invoicesynth = ["py.typed", "provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["PIL.*", "torch.*", "transformers.*", "tokenizers.*", "safetensors.*", "bitsandbytes.*"]
ignore_missing_imports = true

[tool.auditcore-bibquality]
strict = true
regression-command = ["python", "-m", "pytest", "tests", "-q"]
