[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditcore_invoicesynth"
version = "0.1.0"
description = "Synthetic German/Austrian invoice images with Donut ground truth, manifests and evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["auditcore_invoicegenerator==0.2.0"]

[project.optional-dependencies]
render = ["pillow>=9.4"]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "build>=1.2", "bandit>=1.7", "pillow>=9.4"]

[project.scripts]
auditcore-invoicesynth = "auditcore_invoicesynth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditcore_invoicesynth = ["py.typed", "provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true

[tool.auditcore-bibquality]
strict = true
regression-command = ["python", "-m", "pytest", "tests", "-q"]
