[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditcore_entity_matching"
version = "0.2.0"
description = "Characterized entity name normalisation, LEI checks and transparent fuzzy matching"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.optional-dependencies]
fuzzy = ["rapidfuzz>=3.10.1,<4"]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "build>=1.2", "rapidfuzz==3.10.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditcore_entity_matching = ["py.typed", "provenance.json", "profile_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# Keine feste python_version: rapidfuzz zieht numpy-Stubs nach, die ab numpy 2.5
# Python-3.12-Syntax nutzen. Jeder CI-Job (3.11, 3.12, 3.13) prüft gegen seine
# eigene Laufzeit und die dort installierte numpy-Version.
strict = true

[[tool.mypy.overrides]]
module = ["rapidfuzz.*"]
ignore_missing_imports = true

[tool.auditcore-bibquality]
strict = true
regression-command = ["python", "-m", "pytest", "tests", "-q"]
