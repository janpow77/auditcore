[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditcore_price_sources"
version = "0.1.0"
description = "Price and market data adapters (Bundesbank, Destatis GENESIS, EIA, Tankerkoenig, Overpass, EU Oil Bulletin) on auditcore_harvest"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["auditcore_harvest==0.1.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditcore_price_sources = ["py.typed", "provenance.json", "catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.auditcore-bibquality]
strict = true
regression-command = ["python", "-m", "pytest", "tests", "-q"]
