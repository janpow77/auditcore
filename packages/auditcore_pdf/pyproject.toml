[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditcore_pdf"
version = "0.1.0"
description = "Vollständige PDF-Verarbeitung, Seitenoperationen, Anzeige und nachprüfbare Schwärzung für Prüf- und Kontrollprozesse"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["auditcore_common==0.2.0"]

[project.optional-dependencies]
pymupdf = ["pymupdf>=1.23.8"]
pillow = ["Pillow>=10.0"]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
    "ruff>=0.11",
    "mypy>=1.15",
    "build>=1.2",
    "pymupdf>=1.23.8",
    "Pillow>=10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditcore_pdf = ["py.typed", "provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --durations=25"
timeout = 120

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["fitz.*", "pymupdf.*", "PIL.*"]
ignore_missing_imports = true

[tool.auditcore-bibquality]
strict = true
regression-command = ["python", "-m", "pytest", "tests", "-q"]
