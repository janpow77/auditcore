[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditcore_documents"
version = "0.1.0"
description = "Characterized document comparison and German article-law synopsis without web or database dependencies"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.optional-dependencies]
docx = ["lxml>=6.1.0,<7"]
pdf-text = ["pypdf>=4,<7"]
fuzzy = ["rapidfuzz>=3.10,<4"]
docx-render = ["python-docx>=1.1,<2", "lxml>=6.1.0,<7"]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "mypy>=1.15",
    "build>=1.2",
    "lxml>=6.1.0,<7",
    "python-docx==1.1.0",
    "pypdf>=6.16.2,<7",
    "rapidfuzz>=3.10.1,<4",
    "bandit>=1.7",
    "lxml-stubs>=0.5",
]

[project.scripts]
auditcore-documents = "auditcore_documents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditcore_documents = ["py.typed", "provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["rapidfuzz.*", "docx.*", "pypdf.*"]
ignore_missing_imports = true

[tool.auditcore-bibquality]
strict = true
regression-command = ["python", "-m", "pytest", "tests", "-q"]
