[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditcore_auth"
version = "0.1.1"
description = "Password hashing profiles (bcrypt, argon2id) and JWT issuing/verification with per-application compatibility profiles"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.optional-dependencies]
bcrypt = ["bcrypt>=4.0.1"]
argon2 = ["argon2-cffi>=21.1"]
jwt = ["PyJWT>=2.6"]
fastapi = ["fastapi>=0.92", "PyJWT>=2.6"]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "mypy>=1.15",
    "build>=1.2",
    "bandit>=1.7",
    "bcrypt>=4.0.1",
    "argon2-cffi>=21.1",
    "PyJWT>=2.6",
    "cryptography>=41",
    "fastapi>=0.92",
    "httpx>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditcore_auth = ["py.typed", "provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true

[tool.auditcore-bibquality]
strict = true
regression-command = ["python", "-m", "pytest", "tests", "-q"]
