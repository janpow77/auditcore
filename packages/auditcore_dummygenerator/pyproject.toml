[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditcore_dummygenerator"
version = "0.1.2"
description = "Framework-independent synthetic field and row generation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.optional-dependencies]
parallel = ["joblib>=1.3.2"]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditcore_dummygenerator = ["py.typed", "provenance.json", "profiles.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "joblib.*"
ignore_missing_imports = true

[tool.auditcore-bibquality]
regression-command = ["python", "-m", "pytest", "tests", "-q"]
