[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditcore_runner"
version = "0.1.0"
description = "Self-hosted GitHub runners with local autoscaling and a local check bench with unified, baseline-filtered findings"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
dependencies = []

[project.optional-dependencies]
github-app = ["PyJWT[crypto]>=2.8"]
workflows = ["PyYAML>=6.0"]
dev = [
    "PyYAML>=6.0",
    "pytest>=8",
    "ruff>=0.11",
    "mypy>=1.15",
    "build>=1.2",
    "bandit>=1.7",
    "jsonschema>=4.10",
    "types-PyYAML>=6.0",
    "pip-licenses>=5.0",
]

[project.scripts]
auditcore-runner = "auditcore_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditcore_runner = [
    "py.typed",
    "provenance.json",
    "data/Dockerfile",
    "data/supervisor.sh",
    "data/templates/*",
    "data/beispiele/*.json",
    "data/schemas/*.json",
    "data/web/*",
    "data/workflows/*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C901", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603", "S607", "S108", "E501"]
"src/auditcore_runner/**" = ["S603", "S607"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["jwt"]
ignore_missing_imports = true

[tool.auditcore-bibquality]
strict = true
regression-command = ["python", "-m", "pytest", "tests", "-q"]
