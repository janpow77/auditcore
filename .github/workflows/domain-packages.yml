name: domain-packages
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'packaging/**'
      - 'src/auditcore/tools/deployer/**'
      - 'scripts/verify_domain_packages.py'
      - 'scripts/verify_optional_renderers.py'
      - 'scripts/prepare_library_release.py'
      - 'scripts/verify_code_quality.py'
      - 'scripts/ci_affected_packages.py'
      - 'quality/baseline.json'
      - 'src/auditcore/tools/quality/codegate*.py'
      - '.github/workflows/domain-packages.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'packaging/**'
      - 'src/auditcore/tools/deployer/**'
      - 'scripts/verify_domain_packages.py'
      - 'scripts/verify_optional_renderers.py'
      - 'scripts/prepare_library_release.py'
      - 'scripts/verify_code_quality.py'
      - 'scripts/ci_affected_packages.py'
      - 'quality/baseline.json'
      - 'src/auditcore/tools/quality/codegate*.py'
      - '.github/workflows/domain-packages.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  packages:
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || matrix.python == '3.12') && 'ubuntu-latest' || fromJSON(vars.AUDITCORE_RUNNER || '"ubuntu-latest"') }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - name: Select affected packages
        id: affected
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python scripts/ci_affected_packages.py --base "$BASE_REF" > .affected-packages
          else
            python scripts/ci_affected_packages.py > .affected-packages
          fi
          echo "Geprüfte Pakete:"; cat .affected-packages
          echo "## Geprüfte Pakete" >> "$GITHUB_STEP_SUMMARY"; sed 's/^/- /' .affected-packages >> "$GITHUB_STEP_SUMMARY"
          if [ -s .affected-packages ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi
          if grep -qE 'auditcore_(invoicegenerator|reporting)$' .affected-packages; then echo "renderers=true" >> "$GITHUB_OUTPUT"; else echo "renderers=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build and install the platform wheel
        if: steps.affected.outputs.any == 'true'
        run: |
          python -m pip install --upgrade pip build 'setuptools>=83' wheel
          python -m build
          python -m venv .auditcore/package-platform
          .auditcore/package-platform/bin/python -m pip install --upgrade pip 'dist/auditcore-0.2.0-py3-none-any.whl[dev]'
      - name: Prepare Debian installation environment
        if: matrix.python == '3.12' && steps.affected.outputs.any == 'true'
        run: >-
          .auditcore/package-platform/bin/python -I -c
          "from auditcore.tools.deployer.validation import DockerPackageTester;
          print(DockerPackageTester().prepare())"
      - name: Verify real packages through pip and optional APT
        if: steps.affected.outputs.any == 'true'
        env:
          VERIFY_APT: '${{ matrix.python == ''3.12'' }}'
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          packages = [Path(line) for line in Path('.affected-packages').read_text().split()]
          if not packages:
              raise SystemExit(0)
          command = ['python', 'scripts/verify_domain_packages.py', *map(str, packages),
                     '--platform-python', '.auditcore/package-platform/bin/python',
                     '--output', '.auditcore/domain-ci']
          if os.environ['VERIFY_APT'] == 'true':
              command.append('--apt')
          subprocess.run(command, check=True)
          PY
      - name: Verify optional PDF and Excel installations and hash locks
        if: steps.affected.outputs.renderers == 'true'
        run: |
          python scripts/verify_optional_renderers.py .auditcore/domain-ci \
            --output .auditcore/optional-renderers-ci --release-version 0.2.0 \
            ${{ matrix.python == '3.12' && '--apt' || '' }}
      - name: Test installed domain wheels against their source test suites
        if: steps.affected.outputs.any == 'true'
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          python = str(Path('.auditcore/package-platform/bin/python').absolute())
          wheels = sorted(Path('.auditcore/domain-ci/builds').glob('*/*.whl'))
          subprocess.run([python, '-m', 'pip', 'install',
                          *(str(w.absolute()) + '[dev]' for w in wheels)], check=True)
          for project in (Path(line) / 'pyproject.toml' for line in Path('.affected-packages').read_text().split()):
              for arguments in (['pytest', 'tests', '-q'], ['ruff', 'check', '.'],
                                ['mypy', 'src'], ['bandit', '-q', '-ll', '-r', 'src']):
                  subprocess.run([python, '-m', *arguments], cwd=project.parent, check=True)
          subprocess.run([python, '-m', 'pip', 'check'], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.affected.outputs.any == 'true'
        with:
          name: domain-package-evidence-${{ matrix.python }}
          include-hidden-files: true
          path: |
            .auditcore/optional-renderers-ci/result.json
            .auditcore/optional-renderers-ci/*.log
            .auditcore/optional-renderers-ci/requirements-*.txt
            .auditcore/domain-ci/result.json
            .auditcore/domain-ci/*.log
            .auditcore/domain-ci/pip-install.json
            .auditcore/domain-ci/requirements.txt
            .auditcore/domain-ci/builds/*/*
            .auditcore/domain-ci/apt-*/*.deb
            .auditcore/domain-ci/apt-*/*_manifest.json
