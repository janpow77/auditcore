name: donut-train-image
# Job-Image für das Donut-Nachtraining (E3): ghcr.io/janpow77/auditcore-donut-train:cu128
# Rad von auditcore_invoicesynth aus dem Repository-Stand (lokale Version +g<sha>),
# Abhängigkeiten gepinnt (docker/train/requirements-*.txt), Basis per Digest.
on:
  push:
    branches: [main]
    paths:
      - 'packages/auditcore_invoicesynth/**'
      - 'docs/provenance/donut.json'
      - '.github/workflows/donut-train-image.yml'
  pull_request:
    paths:
      - 'packages/auditcore_invoicesynth/**'
      - 'docs/provenance/donut.json'
      - '.github/workflows/donut-train-image.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: donut-train-image-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE: ghcr.io/janpow77/auditcore-donut-train
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Platz schaffen (torch cu128 ≈ 6 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /
      - name: Rad bauen (Repository-Stand)
        id: wheel
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          short="${SHA:0:12}"
          pkg=packages/auditcore_invoicesynth
          version=$(python -c "import tomllib;print(tomllib.load(open('$pkg/pyproject.toml','rb'))['project']['version'])")
          sed -i "s/^version = \"$version\"/version = \"$version+g$short\"/" "$pkg/pyproject.toml"
          python -m pip install --quiet build==1.3.0
          python -m build --wheel --outdir dist "$pkg"
          echo "wheel=$(basename dist/*.whl)" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
      - name: Image bauen
        env:
          WHEEL: ${{ steps.wheel.outputs.wheel }}
          SHORT: ${{ steps.wheel.outputs.short }}
        run: |
          docker build -f packages/auditcore_invoicesynth/docker/train/Dockerfile \
            --build-arg WHEEL="$WHEEL" --build-arg VCS_REF="$SHORT" \
            -t "$IMAGE:cu128" -t "$IMAGE:cu128-g$SHORT" .
      - name: Rauchtest im Image (CPU)
        run: |
          docker run --rm "$IMAGE:cu128" python -c "import torch, transformers, auditcore_invoicesynth as a; print(torch.__version__, torch.version.cuda, transformers.__version__, a.__version__); assert torch.version.cuda.startswith('12.8'); assert 'sm_120' in torch.cuda.get_arch_list()"
          docker run --rm "$IMAGE:cu128" python -m auditcore_invoicesynth.train.cli --help >/dev/null
          docker run --rm "$IMAGE:cu128" python -m auditcore_invoicesynth.train.evaluate --help >/dev/null
          docker run --rm "$IMAGE:cu128" auditcore-invoicesynth fonts | python -c "import json,sys; f=json.load(sys.stdin)['families']; print(f); assert len(f) >= 6"
          docker run --rm "$IMAGE:cu128" ls /licenses
      - name: Nach GHCR schieben
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TOKEN: ${{ github.token }}
          SHORT: ${{ steps.wheel.outputs.short }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:cu128-g$SHORT"
          docker push "$IMAGE:cu128"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:cu128")
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$digest\` (Tags cu128, cu128-g$SHORT)" >> "$GITHUB_STEP_SUMMARY"
          echo "$digest"
