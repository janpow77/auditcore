name: js-packages
on:
  push:
    branches: [main]
    paths:
      - 'packages-js/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - 'scripts/js/**'
      - 'scripts/docs/**'
      - 'docs/bibliotheken/readme-offen.json'
      - 'examples/**'
      - 'quality/ui-parity-exceptions.json'
      - 'docs/ui/**'
      - '.github/workflows/js-packages.yml'
  pull_request:
    paths:
      - 'packages-js/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - 'scripts/js/**'
      - 'scripts/docs/**'
      - 'docs/bibliotheken/readme-offen.json'
      - 'examples/**'
      - 'quality/ui-parity-exceptions.json'
      - 'docs/ui/**'
      - '.github/workflows/js-packages.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  js-packages:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON(vars.AUDITCORE_RUNNER || '"ubuntu-latest"') }}
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '${{ matrix.node }}'
          cache: npm
      - run: npm ci
      - name: Vitest-Worker an die CPU-Quote des Runners anpassen (Node 20 ignoriert die cgroup-Quote)
        run: bash scripts/js/vitest-workers.sh
      - name: Lizenzprüfung (keine bpmn-js-Pakete, nur freigegebene Lizenzen)
        run: npm run license-check
      - run: npm run lint
      - name: ESLint-Ausnahmen zählen
        run: npm run lint:exceptions
      - name: UI-Parität Vue ↔ React (jede Komponente nativ in beiden Fassungen, gemeinsamer Kern, gemeinsame Paritätsfälle)
        run: npm run ui:gate
      - name: Tests des Paritäts-Gates und des Generators ui:neu (Gerüst in einer Workspace-Kopie erzeugen und prüfen)
        if: matrix.node == '22'
        run: npm run test:scripts
      - run: npm run typecheck
      - run: npm test
      - name: React-Pakete zusätzlich gegen React 18.3 testen (Peer-Bereich 18 || 19; Lockfile auf 19)
        if: matrix.node == '22'
        run: npm run test:react18 --workspaces --if-present
      - run: npm run build
      - name: README-Schnellstart typprüfen und ausführen (docs/bibliotheken/readme-vorlage.md)
        run: node scripts/js/check-readme-snippets.mjs
      - name: README-API-Überblick aktuell
        run: python3 scripts/docs/api_overview.py --check --js
      - name: Beispiele (Vue, React, Web Components) aus npm-pack-Tarballs installieren und bauen
        run: node scripts/js/verify-examples.mjs --report examples-report.json
