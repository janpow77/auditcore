name: js-packages
on:
  push:
    branches: [main]
    paths:
      - 'packages-js/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - 'scripts/js/**'
      - '.github/workflows/js-packages.yml'
  pull_request:
    paths:
      - 'packages-js/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'eslint.config.mjs'
      - 'scripts/js/**'
      - '.github/workflows/js-packages.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  js-packages:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON(vars.AUDITCORE_RUNNER || '"ubuntu-latest"') }}
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '${{ matrix.node }}'
          cache: npm
      - run: npm ci
      - name: Lizenzprüfung (keine bpmn-js-Pakete, nur freigegebene Lizenzen)
        run: npm run license-check
      - run: npm run lint
      - name: ESLint-Ausnahmen zählen
        run: npm run lint:exceptions
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
