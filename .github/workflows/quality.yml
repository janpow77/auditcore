name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install --upgrade pip 'setuptools>=83' wheel
      - run: python -m pip install -e '.[dev]'
      - run: pytest --cov=auditcore --cov-report=term-missing
      - run: ruff check .
      - run: mypy src
      - run: auditcore-quality --help
      - run: auditcore-bibquality src/auditcore --strict --context contexts/core.json --output core-quality.json
      - run: auditcore-bibquality src/auditcore/tools/quality --context contexts/quality.json --output quality-selfcheck.json
      - run: auditcore-bibquality src/auditcore/tools/consolidator --context contexts/consolidator.json --output consolidator-selfcheck.json
      - run: auditcore-bibquality src/auditcore/tools/apprefactor --context contexts/apprefactor.json --output apprefactor-selfcheck.json
      - run: auditcore-bibquality src/auditcore/tools/deployer --context contexts/deployer.json --output deployer-selfcheck.json
      - run: auditcore-consolidate --help
      - run: auditcore-refactor --help
      - run: auditcore-deploy --help
      - run: python -m build
      - name: Prepare isolated Debian lifecycle image
        if: matrix.python == '3.12'
        run: >-
          python -c "from auditcore.tools.deployer.validation import DockerPackageTester;
          print(DockerPackageTester().prepare())"
      - name: Verify installed platform and technical package lifecycle
        if: matrix.python == '3.12'
        run: python scripts/verify_installed_framework.py dist/auditcore-0.1.0-py3-none-any.whl
      - name: Verify installed platform CLI and package inventory
        if: matrix.python != '3.12'
        run: python scripts/verify_installed_framework.py dist/auditcore-0.1.0-py3-none-any.whl --smoke-only
      - run: bandit -q -ll -r src
      - run: pip-audit --timeout 60 --format json --output dependency-audit.json
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: evidence-python-${{ matrix.python }}
          include-hidden-files: true
          path: |
            *quality.json
            *selfcheck.json
            dependency-audit.json
            .auditcore/installed-framework/latest.json
            .auditcore/installed-framework/run-*/*.log
            .auditcore/installed-framework/run-*/migration/*.json
            .auditcore/installed-framework/run-*/apt/*.json
            dist/
