name: dependabot-automerge
# Meldet Dependabot-PRs für Patch- und Minor-Updates von Entwicklungswerkzeugen
# zum automatischen Squash-Merge an. GitHub mergt erst, wenn die Required
# Checks (code-quality-gate, ci-ok) grün sind. Nie Major-Updates, nie
# Laufzeitabhängigkeiten – die bleiben zur Prüfung durch Menschen offen.
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {}

jobs:
  automerge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.actor == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot-Metadaten lesen
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
      - name: Auto-Merge anmelden (nur Entwicklungswerkzeuge, nur Patch/Minor)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEPENDENCY_TYPE: ${{ steps.meta.outputs.dependency-type }}
          DEPENDENCY_GROUP: ${{ steps.meta.outputs.dependency-group }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          echo "Update: $NAMES ($ECOSYSTEM, $UPDATE_TYPE, $DEPENDENCY_TYPE, Gruppe: ${DEPENDENCY_GROUP:-–})"
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) ;;
            *) echo "Kein Patch/Minor-Update – bleibt zur Prüfung offen."; exit 0 ;;
          esac
          case "$DEPENDENCY_GROUP" in
            python-dev-tools|npm-dev-tools|github-actions) dev=true ;;
            '') case "$ECOSYSTEM:$DEPENDENCY_TYPE" in
                  npm_and_yarn:direct:development|github_actions:*) dev=true ;;
                  *) dev=false ;;
                esac ;;
            *) dev=false ;;
          esac
          if [ "$dev" != true ]; then
            echo "Laufzeitabhängigkeit – bleibt zur Prüfung offen."; exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
