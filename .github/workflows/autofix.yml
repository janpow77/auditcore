name: autofix
# Routinekorrekturen ohne Menschen: ruff --fix, ruff format, ESLint --fix und
# das Absenken der Code-Qualitäts-Baseline, jeweils nur für die im PR geänderten
# Dateien. Ergebnis wird als Commit „chore(autofix): …“ zurückgepusht.
#
# Sicherheitsmodell:
# - Nur PRs aus diesem Repository (nie Forks), nie Dependabot, kein pull_request_target.
# - Job „fix“ führt den PR-Code aus (pip/npm/ESLint-Konfiguration), hat aber
#   nur Leserechte und keine Secrets. Er liefert nur einen Patch als Artefakt.
# - Job „push“ führt keinen PR-Code aus, wendet nur den Patch an und pusht per
#   SSH mit dem Secret AUTOMATION_DEPLOY_KEY (Deploy-Key mit Schreibrecht). Nur
#   so startet GitHub die CI für den Autofix-Commit; ein Push mit GITHUB_TOKEN
#   löst keine Workflows aus, und die Required Checks blieben aus. Fehlt das
#   Secret, wird nicht gepusht; der Patch liegt dann als Artefakt vor.
# - Endlosschleifen: Ein Commit „chore(autofix)“ an der Spitze wird übersprungen;
#   die Korrekturen sind außerdem idempotent (zweiter Lauf findet nichts).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}
concurrency:
  group: autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.actor != 'dependabot[bot]'
      && !github.event.pull_request.draft
    runs-on: ${{ fromJSON(vars.AUDITCORE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      summary: ${{ steps.patch.outputs.summary }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Eigene Autofix-Commits und betroffene Dateien bestimmen
        id: scope
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          subject=$(git log -1 --format=%s)
          if [[ "$subject" == chore\(autofix\)* ]]; then
            echo "Spitze ist ein Autofix-Commit – nichts zu tun."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed.txt"
          grep -E '\.pyi?$' "$RUNNER_TEMP/changed.txt" | grep -v '^worktrees/' > "$RUNNER_TEMP/py.txt" || true
          grep -E '^(packages-js|scripts/js)/.*\.(js|mjs|cjs|ts|tsx|mts|cts|vue)$' "$RUNNER_TEMP/changed.txt" \
            | grep -v -E '/(dist|node_modules|coverage)/' > "$RUNNER_TEMP/js.txt" || true
          echo "py=$([ -s "$RUNNER_TEMP/py.txt" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "js=$([ -s "$RUNNER_TEMP/js.txt" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if grep -q -E '^(src/|packages/|packages-js/)' "$RUNNER_TEMP/changed.txt"; then
            echo "gate=true" >> "$GITHUB_OUTPUT"
          else
            echo "gate=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Geänderte Dateien:"; cat "$RUNNER_TEMP/changed.txt"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.scope.outputs.skip == 'false' && (steps.scope.outputs.py == 'true' || steps.scope.outputs.gate == 'true')
        with:
          python-version: '3.12'
      - name: Werkzeuge installieren
        if: steps.scope.outputs.skip == 'false' && (steps.scope.outputs.py == 'true' || steps.scope.outputs.gate == 'true')
        run: |
          python -m pip install --upgrade pip 'setuptools>=83' wheel
          python -m pip install -e '.[dev]'
      - name: ruff check --fix und ruff format (nur geänderte Python-Dateien)
        if: steps.scope.outputs.skip == 'false' && steps.scope.outputs.py == 'true'
        run: |
          # ruff sucht je Datei die nächstgelegene pyproject.toml (Paketkonfiguration).
          xargs -a "$RUNNER_TEMP/py.txt" -d '\n' ruff check --fix --exit-zero --force-exclude --quiet
          xargs -a "$RUNNER_TEMP/py.txt" -d '\n' ruff format --force-exclude --quiet || true
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        if: steps.scope.outputs.skip == 'false' && steps.scope.outputs.js == 'true'
        with:
          node-version: '22'
          cache: npm
      - name: ESLint --fix (nur geänderte JS/TS/Vue-Dateien)
        if: steps.scope.outputs.skip == 'false' && steps.scope.outputs.js == 'true'
        run: |
          npm ci --ignore-scripts
          xargs -a "$RUNNER_TEMP/js.txt" -d '\n' npx --no-install eslint --fix --no-warn-ignored || true
      - name: Baseline absenken (nur wenn ausschließlich Absenkungen anfallen)
        if: steps.scope.outputs.skip == 'false' && steps.scope.outputs.gate == 'true'
        run: |
          cp quality/baseline.json "$RUNNER_TEMP/baseline-committed.json"
          auditcore-codegate check --update-baseline || true
          if ! python scripts/ci_baseline_lower_only.py "$RUNNER_TEMP/baseline-committed.json" quality/baseline.json; then
            echo "::notice::Baseline-Aktualisierung enthält mehr als Absenkungen – bleibt dem Menschen überlassen."
          fi
      - name: Patch erzeugen
        id: patch
        if: steps.scope.outputs.skip == 'false'
        run: |
          git diff --binary > "$RUNNER_TEMP/autofix.patch"
          if [ -s "$RUNNER_TEMP/autofix.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            parts=()
            git diff --name-only | grep -q -E '\.pyi?$' && parts+=("ruff")
            git diff --name-only | grep -q -E '\.(js|mjs|cjs|ts|tsx|mts|cts|vue)$' && parts+=("eslint")
            git diff --name-only | grep -q '^quality/baseline.json$' && parts+=("Baseline abgesenkt")
            summary=$(printf '%s, ' "${parts[@]}"); summary=${summary%, }
            echo "summary=${summary:-Korrekturen}" >> "$GITHUB_OUTPUT"
            git diff --stat
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine automatischen Korrekturen nötig."
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.patch.outputs.changed == 'true'
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix.patch
          retention-days: 3

  push:
    needs: fix
    if: needs.fix.outputs.changed == 'true'
    # Führt keinen PR-Code aus; nur dieser Job erhält den Deploy-Key.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Deploy-Key vorhanden?
        id: key
        env:
          HAS_DEPLOY_KEY: ${{ secrets.AUTOMATION_DEPLOY_KEY != '' }}
        run: |
          echo "present=$HAS_DEPLOY_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_DEPLOY_KEY" != true ]; then
            # Ein Push mit GITHUB_TOKEN löst keine CI aus; der PR bliebe ohne Required Checks
            # hängen. Deshalb ohne Deploy-Key nur den Patch bereitstellen.
            echo "::warning::AUTOMATION_DEPLOY_KEY fehlt – Korrekturen liegen nur als Artefakt autofix-patch vor."
            echo "Autofix-Patch als Artefakt \`autofix-patch\` (Secret AUTOMATION_DEPLOY_KEY fehlt, kein Push)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: steps.key.outputs.present == 'true'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          ssh-key: ${{ secrets.AUTOMATION_DEPLOY_KEY }}
          persist-credentials: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: steps.key.outputs.present == 'true'
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix
      - name: Patch anwenden und pushen
        if: steps.key.outputs.present == 'true'
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          SUMMARY: ${{ needs.fix.outputs.summary }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "::notice::Branch wurde inzwischen weiterbewegt – der neue Lauf übernimmt."
            exit 0
          fi
          patch="$RUNNER_TEMP/autofix/autofix.patch"
          # Nur erwartete Dateiarten dürfen im Patch stehen (keine Workflows, keine Skripte anderer Art).
          if git apply --numstat "$patch" | cut -f3 \
               | grep -v -E '^(([^.][^/]*/)*[^./][^/]*\.pyi?|(packages-js|scripts/js)/.*\.(js|mjs|cjs|ts|tsx|mts|cts|vue)|quality/baseline\.json)$'; then
            echo "::error::Patch enthält unerwartete Dateien – nicht übernommen."
            exit 1
          fi
          git -c core.hooksPath=/dev/null apply --index "$patch"
          git -c core.hooksPath=/dev/null \
              -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(autofix): ${SUMMARY}" \
                     -m "Automatische Routinekorrektur durch .github/workflows/autofix.yml."
          git -c core.hooksPath=/dev/null push origin "HEAD:${GITHUB_HEAD_REF}"
