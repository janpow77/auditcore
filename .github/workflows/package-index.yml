name: package-index
# Statischer PEP-503-Paketindex auf GitHub Pages:
#   pip install <paket> --index-url https://janpow77.github.io/auditcore/simple/
# Der Index verlinkt nur die unveränderlichen Release-Dateien mit SHA-256.
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-index
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Release-Dateien laden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isDraft \
                         -q '.[] | select(.isDraft | not) | .tagName'); do
            count=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
              -q '[.assets[].name | select(endswith(".whl") or endswith(".tar.gz"))] | length')
            if [ "$count" -gt 0 ]; then
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "assets/$tag" \
                --pattern '*.whl' --pattern '*.tar.gz'
            fi
          done
      - name: Index bauen
        run: python scripts/build_package_index.py assets site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
