name: nightly
# Nächtliche Vollprüfung von main: volle Python-Matrix, alle Fachpakete mit
# pip- und APT-Test, Installation aus dem öffentlichen Paketindex und der
# gesamte JS-Lauf. Bei Fehler wird das Issue „Nightly rot“ angelegt oder
# kommentiert, bei Erfolg geschlossen.
on:
  schedule:
    - cron: '17 1 * * *'   # 03:17 MESZ / 02:17 MEZ
  workflow_dispatch:
permissions: {}
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  domain-packages:
    # Außerhalb von pull_request prüft der Workflow alle Pakete.
    uses: ./.github/workflows/domain-packages.yml
    permissions:
      contents: read

  js-packages:
    # Gleiche Schritte wie js-packages.yml (dort mit Pfadfilter); hier ohne Filter.
    runs-on: ${{ fromJSON(vars.AUDITCORE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '${{ matrix.node }}'
          cache: npm
      - run: npm ci
      - run: npm run license-check
      - run: npm run lint
      - run: npm run lint:exceptions
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package-index:
    # Installiert alle veröffentlichten Pakete so, wie Nutzer es tun: nur aus dem Index.
    runs-on: ${{ fromJSON(vars.AUDITCORE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      INDEX: https://janpow77.github.io/auditcore/simple/
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - name: Alle Pakete aus dem Paketindex installieren und importieren
        run: |
          names=$(curl -fsS --retry 3 "$INDEX" | grep -o 'href="[^"]*/"' | sed 's/^href="//; s#/"$##')
          [ -n "$names" ] || { echo "::error::Paketindex leer oder nicht erreichbar"; exit 1; }
          python -m venv "$RUNNER_TEMP/index-venv"
          py="$RUNNER_TEMP/index-venv/bin/python"
          "$py" -m pip install --quiet --upgrade pip
          # --index-url (nicht --extra-index-url): kein gleichnamiges Fremdpaket von PyPI.
          # shellcheck disable=SC2086
          "$py" -m pip install --index-url "$INDEX" $names
          "$py" -m pip check
          echo "## Paketindex (Python ${{ matrix.python }})" >> "$GITHUB_STEP_SUMMARY"
          for name in $names; do
            "$py" -c "import importlib.metadata as m, ${name//-/_}; print('$name', m.version('$name'))" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done

  report:
    needs: [quality, domain-packages, js-packages, package-index]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Issue „Nightly rot“ pflegen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: |
            quality: ${{ needs.quality.result }}
            domain-packages: ${{ needs.domain-packages.result }}
            js-packages: ${{ needs.js-packages.result }}
            package-index: ${{ needs.package-index.result }}
        run: |
          title='Nightly rot'
          label='nightly'
          gh api "repos/$REPO/labels/$label" >/dev/null 2>&1 \
            || gh api -X POST "repos/$REPO/labels" -f name="$label" -f color=b60205 \
                 -f description='Nächtliche Vollprüfung' >/dev/null || true
          issue=$(gh api "repos/$REPO/issues?state=open&labels=$label&per_page=100" \
                    --jq "[.[] | select(.title == \"$title\") | .number][0] // empty")
          table=$(printf '%s\n' "$RESULTS" | sed '/^$/d; s/^\([^:]*\): \(.*\)$/| \1 | \2 |/')
          if printf '%s\n' "$RESULTS" | grep -q -E ': (failure|cancelled)$'; then
            body=$(printf 'Die nächtliche Vollprüfung ist fehlgeschlagen (%s).\n\n| Job | Ergebnis |\n|---|---|\n%s\n\nLauf: %s' \
                     "$(date -u +%Y-%m-%d)" "$table" "$RUN_URL")
            if [ -n "$issue" ]; then
              gh api -X POST "repos/$REPO/issues/$issue/comments" -f body="$body" >/dev/null
              echo "Issue #$issue kommentiert."
            else
              gh api -X POST "repos/$REPO/issues" -f title="$title" -f body="$body" \
                -f "labels[]=$label" --jq '"Issue #\(.number) angelegt."'
            fi
            exit 1
          elif [ -n "$issue" ]; then
            gh api -X POST "repos/$REPO/issues/$issue/comments" \
              -f body="Wieder grün: $RUN_URL" >/dev/null
            gh api -X PATCH "repos/$REPO/issues/$issue" -f state=closed -f state_reason=completed >/dev/null
            echo "Issue #$issue geschlossen."
          else
            echo "Alles grün."
          fi
