name: code-quality-gate
# Pflicht-Job: Code-Qualitätsmaßstäbe als Ratchet gegen quality/baseline.json.
# Keine Pfadfilter, damit der Status für jeden PR entsteht (als Required Check nutzbar).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  code-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements/ci.lock
      - run: uv pip install --system -c requirements/ci.lock -e '.[dev]'
      - name: Vergleichsstand bestimmen
        env:
          COMPARE_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        # PR: Vergleich mit dem ersten Elternteil des Merge-Commits, also genau dem
        # main-Stand, gegen den GitHub den PR geprüft hat (nicht dem inzwischen
        # weitergelaufenen origin/main).
        run: |
          ref="$COMPARE_REF"
          if [ -z "$ref" ] || ! git rev-parse --verify --quiet "$ref^{commit}" >/dev/null; then
            ref="HEAD~1"
          fi
          echo "GATE_COMPARE_REF=$ref" >> "$GITHUB_ENV"
      - name: Ratchet (steigt eine Metrik, sinkt sie ohne Baseline-Absenkung oder wird die Baseline unbegründet angehoben, schlägt der Job fehl)
        run: |
          auditcore-codegate check --compare-ref "$GATE_COMPARE_REF" \
            --output code-quality-gate.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Workflow-Sicherheit (zizmor, per Hash gepinnt; ab Schwere medium fail closed)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv pip install --system --require-hashes -r requirements/zizmor.txt
          zizmor --format sarif .github/workflows > zizmor.sarif || true
          zizmor --min-severity medium --format plain .github/workflows
      - name: Workflow-Syntax (actionlint 1.7.12, Prüfsumme gepinnt)
        if: ${{ !cancelled() }}
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive=actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -color=false
      - name: Institutsnamen (Denylist quality/institutsnamen-denylist.txt; Ausnahmen nur mit Begründung in quality/institutsnamen-ausnahmen.txt)
        if: ${{ !cancelled() }}
        run: python scripts/check_institution_names.py --json institution-names.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: ${{ !cancelled() }}
        with:
          node-version: '22'
          cache: npm
      - name: npm-Abhängigkeiten (TypeScript-Compiler für die statische Analyse)
        if: ${{ !cancelled() }}
        run: npm ci --ignore-scripts
      - name: UI-Parität Vue ↔ React (fail closed; Ausnahmen in quality/ui-parity-exceptions.json nur abbauen)
        if: ${{ !cancelled() }}
        run: node scripts/js/ui-parity-gate.mjs --compare-ref "$GATE_COMPARE_REF" --json ui-parity-gate.json
      - name: Plattform-Tests für den Befundbericht (Ergebnis nur im Bericht; rot macht quality)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: >-
          pytest -n auto -q -p no:cacheprovider --junitxml=pytest-junit.xml
          --cov=auditcore --cov-report=json:coverage.json
      - name: Befundbericht (report.md für Agenten und Review, Details in report.json)
        if: ${{ !cancelled() }}
        run: |
          args=(--gate code-quality-gate.json --api-compare-ref "$GATE_COMPARE_REF")
          [ -f pytest-junit.xml ] && args+=(--junit pytest-junit.xml)
          [ -f coverage.json ] && args+=(--coverage coverage.json)
          [ -f code-quality-gate.json ] || args=("${args[@]:2}")
          auditcore-codegate report "${args[@]}" --summary "$GITHUB_STEP_SUMMARY" > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: code-quality-gate
          path: |
            code-quality-gate.json
            report.json
            report.md
            zizmor.sarif
            ui-parity-gate.json
            institution-names.json
