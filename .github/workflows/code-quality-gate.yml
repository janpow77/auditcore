name: code-quality-gate
# Pflicht-Job: Code-Qualitätsmaßstäbe als Ratchet gegen quality/baseline.json.
# Keine Pfadfilter, damit der Status für jeden PR entsteht (als Required Check nutzbar).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  code-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip 'setuptools>=83' wheel
      - run: python -m pip install -e '.[dev]'
      - name: Vergleichsstand bestimmen
        env:
          COMPARE_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        # PR: Vergleich mit dem ersten Elternteil des Merge-Commits, also genau dem
        # main-Stand, gegen den GitHub den PR geprüft hat (nicht dem inzwischen
        # weitergelaufenen origin/main).
        run: |
          ref="$COMPARE_REF"
          if [ -z "$ref" ] || ! git rev-parse --verify --quiet "$ref^{commit}" >/dev/null; then
            ref="HEAD~1"
          fi
          echo "GATE_COMPARE_REF=$ref" >> "$GITHUB_ENV"
      - name: Ratchet (steigt eine Metrik, sinkt sie ohne Baseline-Absenkung oder wird die Baseline unbegründet angehoben, schlägt der Job fehl)
        run: |
          auditcore-codegate check --compare-ref "$GATE_COMPARE_REF" \
            --output code-quality-gate.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: ${{ !cancelled() }}
        with:
          node-version: '22'
          cache: npm
      - name: npm-Abhängigkeiten (TypeScript-Compiler für die statische Analyse)
        if: ${{ !cancelled() }}
        run: npm ci --ignore-scripts
      - name: UI-Parität Vue ↔ React (fail closed; Ausnahmen in quality/ui-parity-exceptions.json nur abbauen)
        if: ${{ !cancelled() }}
        run: node scripts/js/ui-parity-gate.mjs --compare-ref "$GATE_COMPARE_REF" --json ui-parity-gate.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: code-quality-gate
          path: |
            code-quality-gate.json
            ui-parity-gate.json
