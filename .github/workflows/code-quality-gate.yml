name: code-quality-gate
# Pflicht-Job: Code-Qualitätsmaßstäbe als Ratchet gegen quality/baseline.json.
# Keine Pfadfilter, damit der Status für jeden PR entsteht (als Required Check nutzbar).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  code-quality-gate:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON(vars.AUDITCORE_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip 'setuptools>=83' wheel
      - run: python -m pip install -e '.[dev]'
      - name: Ratchet (steigt eine Metrik, sinkt sie ohne Baseline-Absenkung oder wird die Baseline unbegründet angehoben, schlägt der Job fehl)
        env:
          COMPARE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          ref="$COMPARE_REF"
          if [ -z "$ref" ] || ! git rev-parse --verify --quiet "$ref^{commit}" >/dev/null; then
            ref="HEAD~1"
          fi
          auditcore-codegate check --compare-ref "$ref" \
            --output code-quality-gate.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: code-quality-gate
          path: code-quality-gate.json
