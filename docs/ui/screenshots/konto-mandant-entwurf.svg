  <title id="title">Auditcore – Entwurf für Konto und Administration</title>
  <desc id="desc">Zwei statische Designskizzen mit synthetischen Daten: persönliche Profilseite und Mitgliederverwaltung. Gemeinsame Navigation, Farben, Profilkarten und Aktionsleisten für Vue und React. Keine funktionsfähige Anwendung.</desc>
